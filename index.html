<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargantua</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div class="main-container">
        <div class="main-side-content">
            <div class="header-container">
                <div class="header-title-icon" data-tip="Hey, how are you today ?">
                    <svg viewBox="0 0 400 400" id="header-icon-container">
                        <g transform="translate(200, 200)">
                            <path class="header-icon-2"  d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(0)" />
                            <path class="header-icon-2" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(-20)" />

                            <path class="header-icon-2" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(20)" />

                            <path class="header-icon-2" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(40)" />
                            <path class="header-icon-2" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(-40)" />
                            <path class="header-icon-2" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0"  
                                transform="rotate(60)" />
                            <path class="header-icon-2" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(-60)" />
                            <path class="header-icon-2" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(80)" />
                            <path class="header-icon-2" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(-80)" />
                        </g>
                    </svg>
                    Gargantua
                </div>
                <div class="switch-model-container">
                    <button id="header-model-icon-btn" data-tip="Switch Model">
                        <svg viewBox="0 0 17 10" id="header-model-icon-container">
                            <path d="M2.5 2.5 l6 6 6-6" id="header-model-icon" fill="none" stroke="#000000"stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                    <div class="model-selector-container">
                        <h3 id="model-selector-title">Models</h3>
                        <button class="model-selector-btn" id="model-selector-proxima" aria-pressed="true">
                            <svg class="model-selector-btn-icon" xmlns="http://www.w3.org/2000/svg" width="30px" height="30px" viewBox="0 0 20 20" version="1.1">
                                <g id="layer1">
                                    <path d="M 10.001953 1 L 7.75 6.1035156 L 2.2050781 5.5 L 5.5 10 L 2.2050781 14.5 L 7.75 13.898438 L 10.001953 19 L 12.251953 13.898438 L 17.792969 14.5 L 14.501953 10 L 17.794922 5.5 L 12.251953 6.1035156 L 10.001953 1 z M 10 3.4804688 L 11.630859 7.1777344 L 15.648438 6.7402344 L 13.261719 10 L 15.650391 13.261719 L 11.630859 12.824219 L 10 16.521484 L 8.3710938 12.824219 L 4.3515625 13.261719 L 6.7402344 10 L 4.3535156 6.7402344 L 8.3710938 7.1777344 L 10 3.4804688 z " style="fill:#222222; fill-opacity:1; stroke:none; stroke-width:0px;"/>
                                </g>
                            </svg>
                            Proxima
                            <div class="model-selector-checkbox-container">
                                <svg viewBox="0 0 24 10" class="model-selector-checkmark-container">
                                    <path d="M2.5 4.5 l6 6 12.5-9.5" class="model-selector-checkmark"></path>
                                </svg>
                            </div>
                        </button>
                        <button class="model-selector-btn" id="model-selector-proxima-code" aria-pressed="false" style="overflow: visible;">
                            <svg class="model-selector-btn-icon" xmlns="http://www.w3.org/2000/svg" width="30px" height="30px" viewBox="0 0 20 20" version="1.1">
                                <g id="layer1">
                                    <path d="M 10.001953 1 L 7.75 6.1035156 L 2.2050781 5.5 L 5.5 10 L 2.2050781 14.5 L 7.75 13.898438 L 10.001953 19 L 12.251953 13.898438 L 17.792969 14.5 L 14.501953 10 L 17.794922 5.5 L 12.251953 6.1035156 L 10.001953 1 z M 10 3.4804688 L 11.630859 7.1777344 L 15.648438 6.7402344 L 13.261719 10 L 15.650391 13.261719 L 11.630859 12.824219 L 10 16.521484 L 8.3710938 12.824219 L 4.3515625 13.261719 L 6.7402344 10 L 4.3535156 6.7402344 L 8.3710938 7.1777344 L 10 3.4804688 z " style="fill:#024110; fill-opacity:1; stroke:none; stroke-width:0px;"/>
                                </g>
                            </svg>
                            Proxima
                            <div class="badge">
                                Code
                            </div>
                            <div class="model-selector-checkbox">
                                <svg viewBox="0 0 24 10" class="model-selector-checkmark-container">
                                    <path d="M2.5 4.5 l6 6 12.5-9.5" class="model-selector-checkmark"></path>
                                </svg>
                            </div>
                            <span class="badge-training">En entrainement</span>
                        </button>
                    </div>
                </div>
            </div>
            <div id="messages"></div>
            <template id="template">
                <div class="code-card">
                    <div id="code-card1">
                        <p id="code-card1-title">main.py</p>
                        <div class="code-card1-lines">
                            _____
                            <br>
                            _____
                        </div>
                    </div>
                    <div id="code-card2"></div>
                    <button id="code-card-download-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="500px" height="30px" viewBox="0 0 24 24" fill="none">
                            <path d="M3 15C3 17.8284 3 19.2426 3.87868 20.1213C4.75736 21 6.17157 21 9 21H15C17.8284 21 19.2426 21 20.1213 20.1213C21 19.2426 21 17.8284 21 15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M12 3V16M12 16L16 11.625M12 16L8 11.625" stroke="#ffffff"stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <span>Download</span>
                    </button>
                </div>
            </template>
            <div class="input-container">
                <div class="textarea-container">
                    <textarea 
                        id="textarea" 
                        lang="en"
                        autocapitalize="sentences"
                        spellcheck="true"
                        placeholder="Votre prompt..."
                        enterkeyhint="send"
                        autocorrect="on"
                        autocomplete="off"
                        maxlength="4000"></textarea>
                    <button id="input-sendBtn" data-tip="Send Message">
                        <svg viewBox="0 0 24 24" id="input-send-icon-container" fill="none">
                            <path class="input-send-icon" d="M12 4L12 20" stroke="#323232" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M18 10L12.0625 4.0625V4.0625C12.028 4.02798 11.972 4.02798 11.9375 4.0625V4.0625L6 10" stroke="#323232" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="sidebar">
            <div class="sidebar-reload-container">
                <a href="/" style="display: inline-block; width: 50px; height: 50px; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;">
                    <svg viewBox="0 0 400 400" style="transform: scale(1.5);" width="50px" height="50px" id="sidebar-reload-icon">
                        <g transform="translate(200, 200)">
                            <path class="sidebar-openBtn-icon"  d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(0)" />
                            <path class="sidebar-openBtn-icon" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(-20)" />

                            <path class="sidebar-openBtn-icon" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(20)" />

                            <path class="sidebar-openBtn-icon" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(40)" />
                            <path class="sidebar-openBtn-icon" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(-40)" />
                            <path class="sidebar-openBtn-icon" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0"  
                                transform="rotate(60)" />
                            <path class="sidebar-openBtn-icon" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(-60)" />
                            <path class="sidebar-openBtn-icon" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(80)" />
                            <path class="sidebar-openBtn-icon" d="M -150,0 A 150 60 0 1,0 150,0 A 150 60 0 1,0 -150,0" 
                                transform="rotate(-80)" />
                        </g>
                    </svg>
                </a>
            </div>
            <button id="sidebar-openBtn">
                <svg style='transform:scale(2)' xmlns='http://www.w3.org/2000/svg' width='800px' height='800px' viewBox='0 0 16 16' fill='none'><g fill='#000000'><path d='M11.726 5.263a.7.7 0 10-.952-1.026l-3.5 3.25a.7.7 0 000 1.026l3.5 3.25a.7.7 0 00.952-1.026L8.78 8l2.947-2.737z'/><path fill-rule='evenodd' d='M1 3.25A2.25 2.25 0 013.25 1h9.5A2.25 2.25 0 0115 3.25v9.5A2.25 2.25 0 0112.75 15h-9.5A2.25 2.25 0 011 12.75v-9.5zm2.25-.75a.75.75 0 00-.75.75v9.5c0 .414.336.75.75.75h1.3v-11h-1.3zm9.5 11h-6.8v-11h6.8a.75.75 0 01.75.75v9.5a.75.75 0 01-.75.75z' clip-rule='evenodd'/></g></svg>
            </button>
            <div class="sidebar-content">
                <button id="settings-openBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="#000000" height="55px" width="55px" version="1.1" viewBox="0 0 512 512" xml:space="preserve" id="settings-wheel-openBtn">
                        <g>
                            <g>
                                <path d="M451.528,198.531c-4.088-13.938-9.657-27.369-16.645-40.14l42.774-42.773l-81.273-81.274l-42.774,42.773    c-12.771-6.987-26.201-12.557-40.14-16.644V0H198.531v60.472c-13.939,4.088-27.369,9.657-40.14,16.644l-42.774-42.773    l-81.273,81.274l42.774,42.773c-6.988,12.771-12.558,26.202-16.645,40.14H0v114.939h60.472    c4.088,13.938,9.657,27.369,16.645,40.14l-42.774,42.773l81.273,81.274l42.774-42.773c12.771,6.987,26.201,12.557,40.14,16.644    V512h114.939v-60.472c13.939-4.088,27.369-9.657,40.14-16.644l42.774,42.773l81.273-81.274l-42.774-42.773    c6.988-12.771,12.558-26.202,16.645-40.14H512v0V198.531H451.528z M480.653,282.122h-53.755l-2.769,12.204    c-4.301,18.952-11.756,36.932-22.158,53.441l-6.672,10.589l38.026,38.025l-36.942,36.942l-38.027-38.026l-10.589,6.672    c-16.507,10.402-34.487,17.856-53.44,22.157l-12.204,2.771v53.755h-52.245v-53.755l-12.205-2.77    c-18.953-4.301-36.933-11.755-53.44-22.157l-10.589-6.672l-38.027,38.026l-36.941-36.943l38.027-38.026l-6.672-10.589    c-10.402-16.508-17.857-34.489-22.158-53.441l-2.77-12.203H31.347v-52.245h53.755l2.769-12.204    c4.301-18.952,11.756-36.932,22.158-53.441l6.672-10.589l-38.026-38.025l36.942-36.942l38.027,38.026l10.589-6.672    c16.507-10.402,34.487-17.856,53.44-22.157l12.204-2.771V31.347h52.245v53.755l12.205,2.77    c18.953,4.301,36.933,11.755,53.44,22.157l10.589,6.672l38.027-38.026l36.942,36.942L395.3,153.643l6.672,10.589    c10.402,16.508,17.857,34.489,22.158,53.441l2.769,12.204h53.755V282.122z"/>
                            </g>
                        </g>
                        <g>
                            <g>
                                <path d="M256,135.837c-66.258,0-120.163,53.905-120.163,120.163c0,66.258,53.905,120.163,120.163,120.163    c66.258,0,120.163-53.905,120.163-120.163S322.258,135.837,256,135.837z M256,344.816c-48.973,0-88.816-39.843-88.816-88.816    s39.843-88.816,88.816-88.816s88.816,39.843,88.816,88.816S304.973,344.816,256,344.816z"/>
                            </g>
                        </g>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        {
            const sidebar = document.querySelector(".sidebar");
            const sidebar_transition = sidebar.style.transition;
            const mainSideContent = document.querySelector(".main-side-content");
            const mainSideContent_transition = mainSideContent.style.transition;
            const sidebarOpenBtn = document.getElementById("sidebar-openBtn");
            const sidebarOpenBtn_transition = sidebar.style.transition;
            const sidebarOpenBtn__content = sidebarOpenBtn.innerHTML;
            const sidebarReloadContainer = document.querySelector(".sidebar-reload-container");
            const sidebarReloadContainer_transition = sidebarReloadContainer.style.transition;

            if (window.innerWidth < 768) {
                sidebarOpenBtn.textContent = "≡";
            } else {
                const sidebar___Opened = localStorage.getItem("sidebar_opened") || "true";

                if (sidebar___Opened == "true") {
                    sidebar.style.transition = "none";
                    mainSideContent.style.transition = "none";
                    sidebarOpenBtn.style.transition = "none";
                    sidebarReloadContainer.style.transition = "0.2s ease-in-out";
                    sidebarReloadContainer.style.setProperty('--sidebar-reload-container-random-rotate', Math.random() < 0.5 ? '-40deg' : '40deg')
                    sidebar.classList.add("open");
                    mainSideContent.classList.add("open-right");
                    sidebarOpenBtn.innerHTML = "<svg style='transform:scale(2);' xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='#000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><line x1='9' y1='3' x2='9' y2='21'/><path d='M13 8l4 4-4 4'/></svg>";;

                    sidebar.addEventListener("transitionend", () => {
                        sidebar.style.transition = sidebar_transition;
                        mainSideContent.style.transition = mainSideContent_transition;
                        sidebarOpenBtn.style.transition = sidebarOpenBtn_transition;
                        sidebarReloadContainer.style.transition = sidebarReloadContainer_transition;
                    })
                }
            }
        }
    </script>
</body>
</html>
